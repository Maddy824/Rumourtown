<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Page not found, Rumourtown</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#6B8E4E" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      @font-face { font-family: 'Bricolage Grotesque'; src: url('/fonts/BricolageGrotesque-latin.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
      html, body { margin: 0; min-height: 100dvh; }
      body { display: grid; place-items: center; background: #6B8E4E; color: #2E2A22; font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
      .paper { max-width: 30rem; margin: 1.25rem; padding: 2rem 1.5rem; background: #F6F0E4; border-radius: 10px; box-shadow: 0 2px 0 #2E2A2233, 0 28px 54px -20px #2E2A22b3; text-align: center; }
      h1 { font-size: 1.75rem; line-height: 1.15; margin: 0 0 0.75rem; }
      p { font-size: 1.05rem; line-height: 1.55; margin: 0 0 1.25rem; }
      a { display: inline-block; padding: 0.75rem 1.5rem; border-radius: 999px; background: #2E2A22; color: #F6F0E4; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #D9A531; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="paper">
      <h1>Nobody in the village has heard of this page</h1>
      <p>The address may be mistyped, or the page may have moved.</p>
      <a href="/">Go to the village</a>
    </main>
  </body>
</html>
