name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the 400 KB gzipped asset budget
        run: node .github/workflows/check-bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rumortown-dist-node-${{ matrix.node }}
          path: apps/rumortown/dist
          if-no-files-found: error
          retention-days: 14
