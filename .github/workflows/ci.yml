name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the 400 KB gzipped asset budget
        run: node .github/workflows/check-bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rumortown-dist
          path: apps/rumortown/dist
          if-no-files-found: error
          retention-days: 14
