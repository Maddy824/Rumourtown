name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the 400 KB gzipped asset budget
        run: node .github/workflows/check-bundle.mjs
      - name: Deploy the game assets
        working-directory: apps/rumortown
        run: npx --no-install wrangler deploy
      - name: Deploy the API Worker
        working-directory: apps/api
        run: npx --no-install wrangler deploy
